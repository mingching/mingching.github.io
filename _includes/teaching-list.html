<div class="teaching-list">
{% for item in site.data.teaching %}
  <div class="teaching-item reveal">
    <span class="teaching-item__course">{{ item.course }}</span>
    <span class="teaching-item__code">{{ item.code }}</span>
    <span class="teaching-item__terms">{{ item.terms }}</span>
  </div>
{% endfor %}
</div>
