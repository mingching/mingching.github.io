<div class="stats-row reveal" aria-label="Research metrics">
  <a class="stat-tile js-cit-tile" href="https://scholar.google.com/citations?user=a3-Gl8YAAAAJ&amp;hl=en" target="_blank" rel="noopener" aria-label="View Google Scholar profile">
    <span class="stat-tile__value js-count js-cit-count" data-count="{{ site.data.scholar_stats.citations }}">0</span>
    <span class="stat-tile__label">Total citations</span>
  </a>
  <a class="stat-tile" href="#browse-by-year" aria-label="Browse complete paper publication records by year">
    <span class="stat-tile__value js-count" data-count="{{ site.data.publication_stats.paper_publications }}">0</span>
    <span class="stat-tile__label">Paper publications</span>
  </a>
  <a class="stat-tile" href="#patents-technology-transfer" aria-label="View patents and technology transfer records">
    <span class="stat-tile__value js-count" data-count="{{ site.data.publication_stats.patents }}">0</span>
    <span class="stat-tile__label">Patents &amp; Technology Transfer</span>
  </a>
  <a class="stat-tile js-hindex-tile" href="https://scholar.google.com/citations?user=a3-Gl8YAAAAJ&amp;hl=en" target="_blank" rel="noopener" aria-label="View Google Scholar profile">
    <span class="stat-tile__value js-count js-hindex" data-count="{{ site.data.scholar_stats.h_index }}">0</span>
    <span class="stat-tile__label">h-index</span>
  </a>
  <a class="stat-tile js-i10index-tile" href="https://scholar.google.com/citations?user=a3-Gl8YAAAAJ&amp;hl=en" target="_blank" rel="noopener" aria-label="View Google Scholar profile">
    <span class="stat-tile__value js-count js-i10index" data-count="{{ site.data.scholar_stats.i10_index }}">0</span>
    <span class="stat-tile__label">i10-index</span>
  </a>
</div>
